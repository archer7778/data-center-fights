name: Check data

# Runs on pull requests (for example a contributed case) so problems show up before merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: npm ci
      - run: node tools/validate.mjs
      - run: node tools/build.mjs
      - name: Source list is up to date
        run: node tools/sources.mjs && git diff --exit-code docs/sources.md
