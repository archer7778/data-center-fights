name: Publish site

# Rebuilds and publishes the site whenever main changes. Checks the data first, so a broken
# entry stops the publish instead of reaching the public site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install
        run: npm ci
      - name: Check the data
        run: node tools/validate.mjs
      - name: Build pages and data downloads
        run: node tools/build.mjs
      - name: Render share cards
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node tools/cards.mjs
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
